    #vocab-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 60px;
      margin-top: 40px;
      width: min(1200px, 95%);
      margin-left: auto;
      margin-right: auto;
    }

    #main-area {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 600px;
    }

    .correct-anim-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      z-index: 10;
      transition: opacity 0.1s ease-out;
    }

    .correct-anim-container.active {
      opacity: 1;
    }

    .correct-anim-container .popper-svg {
      width: 280px;
      height: 280px;
      overflow: visible;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.35));
    }

    .popper-cone {
      transform-origin: 75px 195px;
      opacity: 0;
    }

    .correct-anim-container.active .popper-cone {
      animation: popper-pop 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .streamer {
      stroke-dasharray: 140;
      stroke-dashoffset: 140;
      opacity: 0;
      transform-origin: 135px 135px;
    }

    .correct-anim-container.active .streamer-1 {
      animation: streamer-fly-1 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    .correct-anim-container.active .streamer-2 {
      animation: streamer-fly-2 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    .correct-anim-container.active .streamer-3 {
      animation: streamer-fly-3 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    .correct-anim-container.active .streamer-4 {
      animation: streamer-fly-4 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    .correct-anim-container.active .streamer-5 {
      animation: streamer-fly-5 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    .particle {
      opacity: 0;
      transform-origin: 135px 135px;
    }

    .correct-anim-container.active .particle-star-1 { animation: particle-fly-1 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    .correct-anim-container.active .particle-star-2 { animation: particle-fly-5 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
    .correct-anim-container.active .particle-star-3 { animation: particle-fly-3 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }

    @keyframes popper-pop {
      0% {
        transform: scale(0.3) rotate(-20deg);
        opacity: 0;
      }
      15% {
        transform: scale(1.18) rotate(8deg);
        opacity: 1;
      }
      30% {
        transform: scale(0.92) rotate(-4deg);
        opacity: 1;
      }
      45% {
        transform: scale(1.05) rotate(2deg);
        opacity: 1;
      }
      65%, 85% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: scale(0.85) rotate(0deg);
        opacity: 0;
      }
    }

    @keyframes streamer-fly-1 {
      0% {
        stroke-dashoffset: 140;
        transform: translate(0, 0) scale(0.3) rotate(0deg);
        opacity: 0;
      }
      20% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      75% {
        opacity: 1;
      }
      100% {

    #task-description,
    .form-label {
      font-size: 1.2em;
      color: #f5f5f5;
      text-align: center;
    }

    #prompt-word {
      font-size: 3em;
      color: #ffc107;
      font-weight: bold;
      text-align: center;
      background: #424242;
      padding: 8px 40px;
      margin-top: 16px;
      margin-bottom: 32px;
      border-radius: 8px;
      border: 2px solid #555;
      min-width: 200px;
    }

    #answer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #vocab-input,
    #english-input {
      width: 100%;
      background: #424242;
      color: #ffc107;
      border: 2px solid #555;
      border-radius: 6px;
      margin-top: 16px;
      margin-bottom: 4px;
      padding: 15px;
      font-size: 1.5em;
      font-family: monospace;
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }

    #english-input {
      margin-bottom: 16px;
    }

    #vocab-input:focus,
    #english-input:focus {
      border-color: #9e9e9e;
    }

    #vocab-input.correct,
    #english-input.correct {
      border-color: #2a8f2a;
      color: #2a8f2a;
    }

    #vocab-input.incorrect,
    #english-input.incorrect {
      border-color: #f44336;
      color: #f44336;
    }

      font-size: 1.2em;
      height: 1.5em;
    }

    #romanji-conversion {
      font-size: 1.2em;
      color: #9e9e9e;
      height: 1.5em;
    }

    #feedback.correct {
      color: #2a8f2a;
    }

    #feedback.incorrect {
      color: #f44336;
    }

    #correct-answer {
      font-size: 1.1em;
      color: #f5f5f5;
      margin-top: 5px;
    }

    #controls {
      display: flex;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    #controls button {
      font-size: 1.2em;
      padding: 10px 30px;
      background: #424242;
      color: #f5f5f5;
      border: 2px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s;
    }

    #controls button:hover {
      background: #555;
      border-color: #ffc107;
      color: #ffc107;
    }

    #controls button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
