<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Vocab Practice - Hiragana Crossword</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../res/favicon.ico">
  <style>
    #vocab-container {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 60px;
      margin-top: 40px;
      width: min(1200px, 95%);
      margin-left: auto;
      margin-right: auto;
    }

    #main-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 600px;
    }

    #task-description,
    .form-label {
      font-size: 1.2em;
      color: #f5f5f5;
      text-align: center;
    }

    #prompt-word {
      font-size: 3em;
      color: #ffc107;
      font-weight: bold;
      text-align: center;
      background: #424242;
      padding: 8px 40px;
      margin-top: 16px;
      margin-bottom: 32px;
      border-radius: 8px;
      border: 2px solid #555;
      min-width: 200px;
    }

    #answer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #vocab-input,
    #english-input {
      width: 100%;
      background: #424242;
      color: #ffc107;
      border: 2px solid #555;
      border-radius: 6px;
      margin-top: 16px;
      margin-bottom: 4px;
      padding: 15px;
      font-size: 1.5em;
      font-family: monospace;
      text-align: center;
      outline: none;
      box-sizing: border-box;
    }

    #english-input {
      margin-bottom: 16px;
    }

    #vocab-input:focus,
    #english-input:focus {
      border-color: #9e9e9e;
    }

    #vocab-input.correct,
    #english-input.correct {
      border-color: #2a8f2a;
      color: #2a8f2a;
    }

    #vocab-input.incorrect,
    #english-input.incorrect {
      border-color: #f44336;
      color: #f44336;
    }

    #feedback {
      font-size: 1.2em;
      height: 1.5em;
    }

    #romanji-conversion {
      font-size: 1.2em;
      color: #9e9e9e;
      height: 1.5em;
    }

    #feedback.correct {
      color: #2a8f2a;
    }

    #feedback.incorrect {
      color: #f44336;
    }

    #correct-answer {
      font-size: 1.1em;
      color: #f5f5f5;
      margin-top: 5px;
    }

    #controls {
      display: flex;
      margin-top: 16px;
      margin-bottom: 16px;
    }

    #controls button {
      font-size: 1.2em;
      padding: 10px 30px;
      background: #424242;
      color: #f5f5f5;
      border: 2px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.2s;
    }

    #controls button:hover {
      background: #555;
      border-color: #ffc107;
      color: #ffc107;
    }

    #controls button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body>
  <div id="head">
    <a id="index" href="../index.html">&lt;</a>
    <h1>Vocab Practice</h1>
  </div>

  <div id="vocab-container">
    <div id="main-area">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div id="prompt-form-label" class="form-label">Convert the word:</div>
        <div id="prompt-word">...</div>
      </div>

      <div id="answer-container">
        <div id="english-container" class="hidden"
          style="width: 100%; display: flex; flex-direction: column; align-items: center;">
          <div class="form-label">to english root:</div>
          <input type="text" id="english-input" placeholder="Type english here..." autocomplete="off">
        </div>

        <div id="target-form-label" class="form-label"></div>
        <input type="text" id="vocab-input" placeholder="Type answer here..." autocomplete="off">
        <div id="romanji-conversion"></div>
        <div id="controls">
          <button id="check-btn">Check</button>
        </div>
        <div id="feedback"></div>
        <div id="correct-answer"></div>
      </div>
    </div>

    <div id="hiragana-keyboard" class="hidden"></div>
  </div>

  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="dictionary.js"></script>
  <script src="vocab.js"></script>
</body>

</html>
