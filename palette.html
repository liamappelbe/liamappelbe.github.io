<!DOCTYPE html>
<html>
<head>
<title>Color Palettes</title>
<link rel="icon" href="res/favicon.ico">
<script src="palette.js"></script>
<script>
let domFile = null;
let domImageCount = null;
let domImageCountLabel = null;
let domRandomCount = null;
let domRandomCountLabel = null;
let domImagePalettes = null;
let domRandomPalettes = null;
let lastImageAction = null;
let lastRandomAction = null;
let imageHistory = [];

function onLoad() {
  domFile = document.getElementById("file");
  domImageCount = document.getElementById("image_count");
  domImageCountLabel = document.getElementById("image_count_label");
  domRandomCount = document.getElementById("random_count");
  domRandomCountLabel = document.getElementById("random_count_label");
  domImagePalettes = document.getElementById("image_palettes");
  domRandomPalettes = document.getElementById("random_palettes");

  loadHistory();
  refreshImageHistory();
  generate();
}
window.addEventListener("load", onLoad);

function loadHistory() {
  const stored = localStorage.getItem("image_history");
  if (stored) {
    imageHistory = JSON.parse(stored);
  }
}

function saveHistory() {
  localStorage.setItem("image_history", JSON.stringify(imageHistory));
}

function onImageCountChange() {
  domImageCountLabel.innerText = domImageCount.value;
  if (lastImageAction) lastImageAction(true);
}

function onRandomCountChange() {
  domRandomCountLabel.innerText = domRandomCount.value;
  if (lastRandomAction) lastRandomAction();
}

function clearPalettes(dom) {
  dom.innerHTML = '';
}

function generate() {
  lastRandomAction = () => {
    clearPalettes(domRandomPalettes);
    onGenerate(parseInt(domRandomCount.value));
  };
  lastRandomAction();
}

function toHex(c) {
  const hex = Math.max(0, Math.min(255, Math.round(c * 255))).toString(16);
  return hex.length == 1 ? "0" + hex : hex;
}

function rgbToHex(rgb) {
  return "#" + toHex(rgb[0]) + toHex(rgb[1]) + toHex(rgb[2]);
}

/**
 * Adds a palette row to the UI.
 * @param {Array<any>} colors Array of [r, g, b] triples (0-1) or hex strings.
 * @param {HTMLElement} dom The container to add to.
 */
function addPalette(colors, dom = domRandomPalettes) {
  const row = document.createElement('div');
  row.className = 'palette_row';
  for (const color of colors) {
    const block = document.createElement('div');
    block.className = 'color_block';
    const hex = (typeof color === 'string') ? color : rgbToHex(color).toUpperCase();
    block.style.backgroundColor = hex;

    const label = document.createElement('span');
    label.className = 'hex_label';
    label.innerText = hex;
    block.appendChild(label);

    block.onclick = () => {
      const wasSelected = block.classList.contains('selected');
      document.querySelectorAll('.color_block.selected').forEach(el => {
        el.classList.remove('selected');
      });
      if (!wasSelected) {
        block.classList.add('selected');
        navigator.clipboard.writeText(hex);
      }
    };

    row.appendChild(block);
  }
  dom.appendChild(row);
}

function refreshImageHistory() {
  clearPalettes(domImagePalettes);
  for (const palette of imageHistory) {
    addPalette(palette, domImagePalettes);
  }
}

function setInputFile(files) {
  for (const file of files) {
    if (file.type.startsWith('image/')) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        processImage(img);
        URL.revokeObjectURL(url);
      };
      img.src = url;
      break;
    }
  }
}

function processImage(img) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  // Downsample if there's too many pixels.
  const maxPixels = 1e5;
  const currentPixels = img.width * img.height;
  let scale = 1.0;
  if (currentPixels > maxPixels) {
    scale = Math.sqrt(maxPixels / currentPixels);
  }

  const width = Math.floor(img.width * scale);
  const height = Math.floor(img.height * scale);
  canvas.width = width;
  canvas.height = height;

  // Browser defaults to high-quality smoothing (bilinear/bicubic).
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, width, height);
  const data = ctx.getImageData(0, 0, width, height).data;

  const pixels = [];
  for (let i = 0; i < data.length; i += 4) {
    pixels.push([data[i] / 255, data[i+1] / 255, data[i+2] / 255]);
  }

  lastImageAction = (isUpdate) => {
    const pal = onImage(pixels, width, height, parseInt(domImageCount.value));
    const hexPalette = pal.map(c => rgbToHex(c.rgb).toUpperCase());
    if (isUpdate) {
      imageHistory[0] = hexPalette;
    } else {
      imageHistory.unshift(hexPalette);
      if (imageHistory.length > 3) {
        imageHistory.pop();
      }
    }
    saveHistory();
    refreshImageHistory();
  };
  lastImageAction(false);
}

function onFileChange() { setInputFile(domFile.files); }
function onDragOver(e) { e.preventDefault(); }
function onDrop(e) {
  e.preventDefault();
  setInputFileFromDataTransfer(e.dataTransfer);
}
function onPaste(e) {
  e.preventDefault();
  setInputFileFromDataTransfer(e.clipboardData);
}
function setInputFileFromDataTransfer(dt) {
  let files = [];
  if (dt.items) {
    for (const item of dt.items) {
      if (item.kind == "file") files.push(item.getAsFile());
    }
  } else {
    files = dt.files;
  }
  setInputFile(files);
}
</script>
<style>
html {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
body {
  background-color: #212121;
  margin: 0;
  flex-grow: 1;
}
#head {
  background-color: #424242;
  width: 100%;
  display: flex;
  justify-content: space-around;
  margin-bottom: 16px;
}
h1, h2, #index {
  color: #ffc107;
  text-align: center;
  font-family: monospace;
  font-size: 42px;
  flex-grow: 1;
  padding: 16px;
  margin: 0;
}
h2 {
  font-size: 32px;
  padding: 8px;
}
#index {
  color: #ff5722;
  text-decoration: none;
  flex-grow: 0;
}
a {
  color: #ff5722;
  font-family: monospace;
  font-size: 24px;
  cursor: pointer;
  text-decoration: underline;
}
#wrap {
  padding: 0 16px;
  color: #f5f5f5;
  font-family: monospace;
  font-size: 24px;
}
.controls {
  margin-bottom: 24px;
  text-align: center;
}
input[type="file"] {
  display: none;
}
input[type="range"] {
  vertical-align: middle;
}
.palette_row {
  display: flex;
  height: 64px;
  margin-bottom: 12px;
  border: 1px solid #424242;
}
.color_block {
  flex-grow: 1;
  flex-basis: 0;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
}
.color_block:hover, .color_block.selected {
  outline: 2px solid #f5f5f5;
  z-index: 1;
}
.hex_label {
  display: none;
  position: absolute;
  font-family: monospace;
  font-size: 16px;
  background: rgba(0, 0, 0, 0.7);
  color: #f5f5f5;
  padding: 4px;
  border-radius: 4px;
  pointer-events: none;
  white-space: nowrap;
}
.color_block.selected .hex_label {
  display: block;
}
</style>
</head>
<body ondrop="onDrop(event)" ondragover="onDragOver(event)" onpaste="onPaste(event)">
  <div id="head">
    <a id="index" href="index.html">&lt;</a>
    <h1>Color Palettes</h1>
  </div>
  <div id="wrap">
    <div id="image_section">
      <h2>Image Palettes</h2>
      <div class="controls">
        <label>
          <input type="file" id="file" accept="image/*" onchange="onFileChange()">
          <a>Load Image</a>
        </label>
        &nbsp;&nbsp;
        Colors:
        <input type="range" id="image_count" min="2" max="10" value="5" oninput="onImageCountChange()">
        <span id="image_count_label">5</span>
      </div>
      <div id="image_palettes"></div>
    </div>

    <div id="random_section">
      <h2>Random Palettes</h2>
      <div class="controls">
        <a onclick="generate()">Randomize</a>
        &nbsp;&nbsp;
        Colors:
        <input type="range" id="random_count" min="2" max="10" value="5" oninput="onRandomCountChange()">
        <span id="random_count_label">5</span>
      </div>
      <div id="random_palettes"></div>
    </div>
  </div>
</body>
</html>
